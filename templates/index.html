<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Clean, descriptive title -->
    <title>AI Chatbot</title>
    <!-- Use modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Link to custom styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <!-- Clean Header -->
        <header class="chat-header">
            <h2>Local AI Assistant</h2>
        </header>
        
        <!-- Chat History Area -->
        <main class="chat-messages" id="chat-messages">
            <!-- Messages will be injected dynamically via JS -->
        </main>
        
        <!-- Input Area -->
        <footer class="chat-input-container">
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Message AI Assistant..." autocomplete="off" required>
                <button type="submit" id="send-button" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Link to client-side logic -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
